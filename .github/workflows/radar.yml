
name: BingX AI Radar

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 下載程式
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝所需套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 檢查程式語法
        run: python -m py_compile main.py

      - name: 讀取上一輪行情
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: bingx-radar-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bingx-radar-v2-

      - name: 啟動 BingX AI 雷達
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u main.py --once

      - name: 保存本輪行情
        if: ${{ success() && hashFiles('state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: bingx-radar-v2-${{ github.run_id }}-${{ github.run_attempt }}
